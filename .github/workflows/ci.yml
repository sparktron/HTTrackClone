name: CI

on:
  push:
    branches: [ master, 'robustness-*', 'upstream-sync/*' ]
  pull_request:
    branches: [ master ]

env:
  # Warnings that have each caught a real defect in this tree and are now
  # clean, so they are hard errors. Grow this list; do not shrink it.
  #
  #   type-limits          -- found the unsigned countdown in
  #                           cookie_cmp_wildcard_domain() (OOB read) and the
  #                           max(0, strlen(x) - 4) underflow in htsparse.c
  #   extra                -- found (r.contenttype >= 0), an always-true
  #                           comparison of a char[64] against 0
  #   misleading-indentation,
  #   implicit-function-declaration, return-type, uninitialized,
  #   strict-prototypes    -- cheap, no false positives here
  #
  # Since the upstream 3.50.3 sync the engine is upstream's code, which uses
  # partial struct initializers on purpose (so missing-field-initializers is
  # soft below), and a portable 64-bit range check in htswarc.c that clang's
  # tautological-type-limit-compare calls always true (turned off for clang in
  # the Build step; gcc keeps -Werror=type-limits in full).
  HARD_WARNINGS: >-
    -Werror=type-limits
    -Werror=misleading-indentation
    -Werror=implicit-function-declaration
    -Werror=return-type
    -Werror=uninitialized
    -Werror=strict-prototypes
  # Warnings this tree does not satisfy yet. Each line is a debt to pay off;
  # delete it once the tree is clean and the corresponding -Werror= is added
  # above.
  SOFT_WARNINGS: >-
    -Wno-missing-field-initializers
    -Wno-unused-parameter
    -Wno-sign-compare
    -Wno-unused-but-set-variable
    -Wno-unused-variable
    -Wno-unused-function
    -Wno-unused-value

jobs:
  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool autoconf-archive zlib1g-dev libssl-dev \
            libbrotli-dev libzstd-dev \
            libcurl4-openssl-dev libsqlite3-dev libicu-dev

      - name: Configure
        run: |
          # Keep warning errors out of configure probes: Autoconf's generic
          # function declarations are intentionally old-style and trip
          # -Werror=strict-prototypes. Apply them to the actual build below.
          ./bootstrap
          ./configure --enable-imageboard-catalog CFLAGS="-O2 -g"

      - name: Build
        run: |
          extra=""
          if [ "$CC" = clang ]; then extra="-Wno-tautological-type-limit-compare"; fi
          make -j"$(nproc)" CFLAGS="-O2 -g -Wall -Wextra $HARD_WARNINGS $SOFT_WARNINGS $extra"

      - name: Test
        run: make check -j16 ONLINE_UNIT_TESTS=no

      - name: Show test log on failure
        if: failure()
        run: cat tests/test-suite.log || true

  # The suite under ASan+UBSan. gcc, as upstream's sanitize job uses: clang's
  # ASan cannot link the shared libhttrack under -Wl,--no-undefined, and a
  # static-only build fails the tests that install or dlopen shared objects.
  sanitizers:
    name: asan+ubsan (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool autoconf-archive zlib1g-dev libssl-dev \
            libbrotli-dev libzstd-dev \
            libcurl4-openssl-dev libsqlite3-dev libicu-dev

      - name: Configure
        run: |
          ./bootstrap
          ./configure --enable-imageboard-catalog CC=gcc \
            CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all" \
            LDFLAGS="-fsanitize=address,undefined"

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        env:
          # The CLI intentionally retains process-lifetime global state; each
          # test launches a fresh process, so leak reports are not actionable
          # here. Keep AddressSanitizer's memory-error checks enabled.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make check -j16 ONLINE_UNIT_TESTS=no

      - name: Show test log on failure
        if: failure()
        run: cat tests/test-suite.log || true

  # libFuzzer needs clang, and clang's ASan needs a static build (see above).
  # Replays upstream's corpora and smoke-runs the fork's own four harnesses.
  fuzz:
    name: fuzz (clang, asan+ubsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang autoconf automake libtool autoconf-archive zlib1g-dev libssl-dev \
            libbrotli-dev libzstd-dev \
            libcurl4-openssl-dev libsqlite3-dev libicu-dev

      - name: Configure
        run: |
          ./bootstrap
          ./configure --enable-fuzzers --disable-shared CC=clang \
            CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all" \
            LDFLAGS="-fsanitize=address,undefined"

      - name: Build
        run: make -j"$(nproc)"

      - name: Replay upstream corpora
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: bash fuzz/run-fuzzers.sh fuzz check

      - name: Fork fuzzer smoke test
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make -C fuzz -f fork-fuzzers.mk smoke

  analyze:
    name: clang static analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool autoconf-archive zlib1g-dev libssl-dev \
            libbrotli-dev libzstd-dev clang-tools \
            libcurl4-openssl-dev libsqlite3-dev libicu-dev

      - name: Configure
        run: ./bootstrap && scan-build ./configure

      # Reporting only for now: the tree still has known findings (leaks in
      # htscharset.c, null dereferences in htslib.c / htsparse.c). Once those
      # are fixed, add --status-bugs to fail the job.
      - name: Analyze
        run: scan-build -o analyzer-report make -j"$(nproc)"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-report
          path: analyzer-report
          if-no-files-found: ignore

  sbom:
    name: SBOM and third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool autoconf-archive zlib1g-dev libssl-dev \
            libbrotli-dev libzstd-dev \
            libcurl4-openssl-dev libsqlite3-dev libicu-dev

      # Cheap, and needs no build: fails if source was vendored into the tree
      # without a matching row in THIRD-PARTY-NOTICES.md.
      - name: Check notices cover what is vendored
        run: tools/generate-sbom.sh --check

      - name: Configure
        run: ./bootstrap && ./configure CFLAGS="-O2 -g"

      - name: Build
        run: make -j"$(nproc)"

      # Linked library versions are a property of this runner, so the SBOM is
      # only meaningful next to the build it describes.
      - name: Generate SBOM
        run: tools/generate-sbom.sh --output sbom.json

      - name: Show SBOM
        run: cat sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
